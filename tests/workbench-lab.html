<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教學流程檢查</title><body style="padding:30px;background:#12291e;color:#e5e9c9"><nav id="labs"></nav><main id="lab-root"></main><output id="lab-status"></output><script type="module">import {mountWorkbench} from '/src/workbench.js';import '/src/style.css';import '/src/workbench.css';let dispose;for(const k of ['evidence','water','cleanup','soil','plants','transfer']){const b=document.createElement('button');b.textContent=k;b.onclick=()=>{dispose?.();document.querySelector('#lab-status').textContent='';dispose=mountWorkbench(document.querySelector('#lab-root'),k,null,()=>{},()=>document.querySelector('#lab-status').textContent=k+' completed',()=>{});};document.querySelector('#labs').append(b);}</script></body></html>
